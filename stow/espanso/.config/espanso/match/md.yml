matches:
    - trigger: ",pc"
      replace: "```postgresql\n"

    - trigger: ",ll"
      replace: "[]($|$)"

    - trigger: ",lg"
      replace: "[]({{url}})"
      vars:
          - name: url
            type: match
            params:
                trigger: ",gif"

    - trigger: ",gif"
      replace: "{{url}}"
      vars:
          - name: url
            type: choice
            params:
                values:
