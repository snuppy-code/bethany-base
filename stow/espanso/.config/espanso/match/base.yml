matches:
    - trigger: "x,flt"
      replace: "Jeg får feilmelding når jeg oppgir 37.78! Hvis du konverterer med `float( )` istedenfor `int( )` får du ikke feilmelding i det tilfellet, siden flyttall kan representere desimaltall."
    - trigger: "y,flt"
      replace: "Jeg liker at du bruker `float( )` og dermed passer på tilfellet der input har desimaler :)"

    - trigger: "x,blt"
      replace: "Merk at vi fort kommer til å møte på problemer hvis vi prøver å utvide koden på grunn av en liten ting som mangler. input gir tilbake str, ikke float, så når du tilordner de nye varene til ordboka, får du at noen varer har en verdi av type float, og andre (de nye) har en verdi av type str. Vi vil helst unngå denne typen blanding av typer, så det hadde vært smart å bruke `float( )` rundt `input( )` for å konvertere typen"

    - trigger: "x,cas"
      replace: "Du kunne vurdert å bruke .lower() eller .upper() for å passe på at det ikke har noe å si om brukeren skriver stor eller liten bokstav !"
    - trigger: "y,cas"
      replace: "Jeg liker at du bruker .lower() så det ikke har noe å si om brukeren skriver stor eller liten bokstav :)"

    - trigger: "x,sp"
      replace: "Jeg skulle gjerne likt å se mellomrom etter teksten din når du henter inn tekst fra brukeren, så det de skriver ikke er rett inntil spørsmålet !"
    - trigger: "y,sp"
      replace: "Jeg liker at du har mellomrom etter teksten din når du henter inn tekst fra brukeren, så det de skriver ikke er rett inntil spørsmålet :)"

    - trigger: "x,pro"
      replace: "Du bør unngå prosedyrer med navn med stor forbokstav (!) se gjerne notat lenger ned om hvorfor."
    - trigger: "n,pro"
      replace: |
          ### Om navn på prosedyrer

          De fleste programmeringsspråk har sine standarder eller konvensjoner for hvordan man navngir forskjellige ting. Mesteparten av python-koden i verden følger standarden som heter "PEP-8", og IN1000 følger stort sett også denne.

          I PEP-8 står det at en ikke skal starte prosedyrer sine navn med stor bokstav, da dette brukes bla. for navn på klasser, noe dere kommer til å møte på om noen uker.

          Du trenger nok ikke huske PEP-8, men du bør starte prosedyrenavn med liten bokstav:
          ```py
          # 👎️
          def Ost():
              print("ost")

          # 👍️
          def ost():
              print("ost")
          ```
    - trigger: "x,var"
      replace: "Du bør unngå variabelnavn med stor forbokstav (!) se gjerne notat lenger ned om hvorfor."
    - trigger: "n,var"
      replace: |
          ### Om variabelnavn

          De fleste programmeringsspråk har sine standarder eller konvensjoner for hvordan man navngir forskjellige ting. Mesteparten av python-koden i verden følger standarden som heter "PEP-8", og IN1000 følger stort sett også denne.

          I PEP-8 står det at en ikke skal starte variabler sine navn med stor bokstav, da dette brukes bla. for navn på klasser, noe dere kommer til å møte på om noen uker.

          Du trenger nok ikke huske PEP-8, men du bør starte variabelnavn med liten bokstav:
          ```py
          # 👎️
          Hovedrett = "ja"

          # 👍️
          hovedrett = "ja"
          ```

    - trigger: ",tt"
      replace: "{{output}}"
      vars:
          - name: form1
            type: form
            params:
                layout: "Oppgaver gjort (f.eks. q,1,2,6): [[tasks]]"
          - name: output
            type: script
            params:
                args:
                    - /run/current-system/sw/bin/python
                    - "%CONFIG%/scripts/generate_template.py"
                    #- "--oblig_nr"
                    #- "5"
                    - "{{form1.tasks}}"

    - trigger: "x,run"
      replace: "Husk å kjøre og teste programmene dine før du leverer! Arbeidet med testing og retting av feil er kanskje der du lærer aller mest, ved å rette opp i misforståelser og bli tryggere på python. Finner du ikke ut hva som er feil, skal det kommenteres i Devilry"
    - trigger: ",slit"
      replace: "Om du sliter, husk at IN1000 har mange tilbud! F.eks. pragmatisk programmering."

    - trigger: ",teit"
      replace: "Ja disse oppgavene kan være litt rare noen ganger, men det kan eksamen også være, så det er god øving for eksamen om ikke annet."

    - trigger: ",inn"
      replace: "{{in}}"
      vars:
          - name: in
            type: choice
            params:
                values:
                    - Godt jobba, du er flink!
                    - Dette får du til!
                    - Dette kan du ganske godt!
                    - Du kan mye av det viktigste!
                    - Godt jobba, du har det viktigste fra disse ukene :D
                    - Godt jobba! Du demonstrerer mye forståelse.
                    - Godt jobba, du har det aller meste på plass!

                    - Du har mye av det viktigste på plass! Se tilbakemeldingene under.
                    - Godt jobba, du demonstrerer mye viktig forståelse! Jeg tror muligens du bør øve mer på x. Se større tilbakemelding under.
                    - Godt jobba, du kan dette ganske godt, men det er viktig at du leser oppgavene nøye!
                    - Dette får du til, husk bare å lese oppgavene nøye !
                    - Du har det viktigste på plass! Husk å lese oppgavene nøye!

                    - Du har det viktigste på plass! Se tilbakemeldingene under for noen presiseringer.

                    - Godt jobba! Foreslår at du ser på prosedyrer. Se tilbakemelding under.

                    - Godt jobba, du har gjort mye bra arbeid, men du er ikke helt i mål. Jeg gir nytt forsøk med 4 virkedagers utsettelse!
                    - Godt jobba, du er flink, du må bare lese oppgaven litt mer forsiktig! Jeg gir nytt forsøk og 4 virkedagers utsettelse!
                    - Det kan se ut som om du har løst oppgavene, men jeg kan ikke rette de siden du ikke har lastet opp alle filene. Jeg gir nytt forsøk og 4 virkedagers utsettelse!

    - trigger: ",qu"
      replace: "{{qu}}"
      vars:
          - name: qu
            type: choice
            params:
                values:
                    - "6 av 6, full pott :D"
                    - "6/6! Full pott!"
                    - "5 av 6, det er ikke ille!"
                    - "5/6 er bra!"
                    - "4 av 6, ikke værst!"
                    - "4/6 er ikke ille!"

    - trigger: ",for1"
      replace: "Går det ann å skrive dette enklere med en for-løkke uten å bruke len(), range(), eller indeksering ?"
    - trigger: ",for2"
      replace: "for-løkke kan ikke brukes når vi ikke vet antall nødvendige steg (og det ikke er utledbart fra kjente kvantiteter f.eks. lengde på en liste med fast innhold)."
    - trigger: ",st3"
      replace: "Ser ut som om du hoppet over, eller leste steg 3 litt fort! Husk å lese oppgavene nøye!"
    - trigger: ",er1"
      replace: "Hadde det vært mulig å la bruker prøve igjen uten å restarte programmet, til de skriver gyldige indekser?"
    - trigger: ",er2"
      replace: "`try` tror jeg muligens ikke er direkte pensum i IN1000, og uten det blir det litt vanskelig å håndtere mange feil. Men en feil som kan håndteres er hvis bruker skriver en nøkkel som ikke tilsvarer en verdi i samlingen. Vi kan sjekke dette (f.eks. hvis samlingen er en liste, ved å sjekke mindre enn, større enn, eller hvis samlingen er en ordbok, ved å sjekke om det brukeren oppga er i mengden av nøkler) og la de prøve på nytt til det er gyldig, ved bruk av en while-løkke."

    - trigger: ",konv"
      replace: "Unødvendig å eksplisitt konvertere resultat av input (en str) til str :p"
    - trigger: ",cont"
      replace: "En ting du kan gjøre for å slippe å holde styr på ferdig-variabelen, er å duplisere linjene der du henter input, ut til før while-løkka, og ha selve while-sjekken sjekke det du nå sjekker for å sette ferdig-variabelen."
    - trigger: ",ind"
      replace: "Du har et indentasjonsfeil som gjør at koden ikke funker på måten du forventer, og funker av tilfeldighet !"

    - trigger: ",tolk"
      replace: "Et generelt tips om du er usikker på tolkningen av en oppgave: Lag en kommentar i programmet der du beskriver alternative tolkninger. Skriv hvilken du velger og gjerne hvorfor. Løs oppgaven basert på dette."
    - trigger: ",tatt"
      replace: 'Merk at du kan få noen utilsiktede effekter når du bruker `sum` som variabelnavn, fordi sum() er en operasjon man kan gjøre på bl.a. lister i python. Det er bedre å bruke et navn som ikke er "tatt", slik som f.eks. `summen` :)'

    - trigger: ",idx"
      replace: "Det hadde vært litt enklere å skrive for-løkken med `range(len(tastet_inn_tall))`, så slipper du å holde styr på `indeks` selv! Generelt hvis du merker at du holder styr på din egen indeks for noe i en for-løkke, er det et tegn på at det kanskje bør implementeres på en annen måte."

    - trigger: ",com"
      replace: 'Det er bra at du kommenterer koden din! For å skrive enda bedre kommentarer foreslår jeg at du skriver mindre om "hva" som skjer (det kan man jo lese fra koden!) og mer om hvorfor, altså dine intensjoner og tanker mens du skrev koden. Ting en ikke får ut av å lese koden. F.eks. `# skriver ut tallene i listen` over en print-statement tilføyer ikke noe ukjent :p'

    - trigger: ",ii"
      replace: 'Foreslår å unngå navnet "i" for variabler i for-løkker som representerer alt annet enn indekser. Det er veldig vanlig stil å kalle variabelen "i" for indekser (0,1,2,3...) og "v" for verdier (f.eks. 9,2,20,-3,49,...). Dette kan være forvirrende for andre som leser koden.'

    - trigger: ",dev"
      replace: "Husk å svare på spørsmålene i devilry neste gang!"
    - trigger: ",tfk"
      replace: "x skriver ut, heller enn å returnere. Tips: Det er ikke bare når vi ser \"returner\" i oppgaveteksten at vi vet vi må gjøre det - \"skriv en funksjon..\" vil også si at noe skal returneres."
    - trigger: "y,stf"
      replace: "Du utfører god praksis når du stenger filer etter du er ferdig med de i funksjonene, bra!"
    - trigger: "x,stf"
      replace: "Husk for hver fil du åpnet med `open` at så snart du er ferdig å lese fra den må du stenge den med `close()`! Dette er god praksis og kan hindre at du har problemer senere i koden din."
    - trigger: "x,navn"
      replace: "Noen endringer til noen av navnene kan gjøre koden mer leselig, f.eks. er det ikke åpenbart fra navnet hva `siste_prosedyre` gjør, eller at `nye_rekorder_2018` parameteren dens er navnet på filen den skriver til."
    - trigger: "y,ass"
      replace: "Jeg syns du har god bruk av asserts!"
    - trigger: ",un"
      replace: "Tips: Når du ikke bruker variabelen fra en for-løkke (eller liknende) er det vanlig konvensjon å navngi den `_`."
    - trigger: "x,rl"
      replace: "Helst skulle koden vært i samme mappe som filene, og lest filene fra samme mappe den *kjøres* fra! Dette gjør det lettere for retterne, siden mappestruktur kan være unik per student. Dersom terminalen din sin \"working directory\" (synlig med `pwd`) er den mappa som csv-filene er i, kunne du åpnet de i koden med bare `open(\"filen.csv\")`. Når du kjører programmet direkte fra vscode kjøres det antakeligvis fra den ytterste mappen du har åpen i vscode."
    - trigger: ",stvl"
      replace: "Tips: Når du setter en variabel til en startverdi med intensjon av å overskrive den, (f.eks. du setter `maks_temp = -100`) er det ofte smartere å sette den lik `None` og tilordne hva enn den første verdien er, til den. Altså ha en linje som `if maks_temp is None:` der du tilordner uten noen andre krav. Da slipper du at hvis det plutselig finnes en måling på -101 så får du problemer!"
    - trigger: ",ofgg"
      replace: "Når jeg skriver `hei hei Hei på deg` får jeg ordet \"hei\" opp to ganger, og ordet \"Hei\" opp en gang. Hadde det vært mulig å bare inkludere et ord en gang i listen, uansett hvor mange ganger bruker skrev det, og uansett versal?"
