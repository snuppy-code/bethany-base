position = "Top"
outputs = "All"

[modules]
left = [ [ "Workspaces","WindowTitle" ] ]
center = [ "KeyboardLayout","Tempo","MediaPlayer" ]
right = [ "SystemInfo", "Tray", ["Privacy", "Settings" ] ]

[settings]
logout_cmd = "niri msg action quit -s"
hibernate_cmd = "systemctl hibernate"
battery_format = "IconAndPercentageAndTime"

