"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:seg1)\
[ ](fg:fg0 bg:seg1)$character$username\
$hostname\
[ ](fg:seg1)\
[](fg:seg2)\
$directory\
[](fg:seg2 bg:seg3)\
[ ](fg:fg0 bg:seg3)\
($git_branch[ ](fg:fg0 bg:seg3))\
[](fg:seg3 bg:seg4)\
[ ](bg:seg4 fg:fg0)$nix_shell\
[ ](fg:seg4)\
"""
#
#

# [](fg:seg3 bg:seg4)\
# [ ](bg:seg4 fg:fg0)$nix_shell\

palette = 'volcanic_shale_deep'

[palettes.kelp_forest_shallow] #    fish:"solarized"  kitty:"Everforest Light Hard"
fg0  = '#ffffff'
seg1 = '#6d9ba7'#7c9ca4 #6d9ba7
seg2 = '#7c9f8b'#82a390 #7c9f8b
seg3 = '#b7be84'#b7be84 #b7be84
seg4 = '#c2a37b'#c2a37b #c2a37b
err  = '#7a2e2a'
root = '#b37772'
vim0 = '#2f5a3c'
vim1 = '#6b3a63'
vim2 = '#6b4610'

